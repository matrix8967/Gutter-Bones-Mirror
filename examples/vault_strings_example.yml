# ====================
# USAGE INSTRUCTIONS
# ====================

# TO CREATE VAULT STRINGS:
#
# 1. Use the vault_secrets.sh script:
#    ./scripts/vault_secrets.sh encrypt-string "mySecretPassword"
#
# 2. Or use ansible-vault directly:
#    ansible-vault encrypt_string --vault-password-file .Vault_Pass.txt "mySecret"
#
# 3. Interactive mode:
#    ./scripts/vault_secrets.sh interactive
#
# TO USE IN PLAYBOOKS:
#
# - Variables work exactly the same as plaintext
# - Ansible automatically decrypts vault strings
# - Reference normally: "{{ admin_password }}"
#
# TO EDIT VAULT STRINGS:
#
# 1. Decrypt to see current value:
#    ./scripts/vault_secrets.sh decrypt-string "$ANSIBLE_VAULT;1.1;AES256..."
#
# 2. Encrypt new value:
#    ./scripts/vault_secrets.sh encrypt-string "newPassword"
#
# 3. Replace the vault string in the file
#
# BENEFITS:
# ✓ File remains readable and diffable
# ✓ Only secrets are encrypted
# ✓ Easy to see structure and non-sensitive values
# ✓ Can selectively encrypt different values
# ✓ Works with all Ansible tools
# ✓ Better for code reviews and documentation
