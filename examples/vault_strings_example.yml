          $ANSIBLE_VAULT;1.1;AES256
          33363535613762663930656566633563646432363236626533666539343330363337356662663264
          3234373564303561626638316632386136373333383237320a353632613561313566313732623066
          35613566323631386331323063626662376365666139656666623438636639373166326365363938
          3038653433646135330a383264346362666333383935303836623532323763363830396138346537

# Public key can remain plaintext (not sensitive)
ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC... user@hostname"

