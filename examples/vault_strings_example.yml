# ====================
# VAULT STRINGS EXAMPLE
# ====================
# This file demonstrates how to use Ansible Vault strings
# to encrypt individual secrets while keeping YAML readable

# ====================
# BASIC VAULT STRINGS
# ====================

# Instead of encrypting the whole file, encrypt just the secret values:

# BEFORE (plaintext - INSECURE):
# admin_password: "mySecretPassword123"

# AFTER (vault string - SECURE):
admin_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66663036386439643835653361386437663265336665663539323632353939376439306266373064
          3766386661643430623064396537656238376462333234370a343834633234343366623935656366
          36613538663431633661653839633639316335343030323731313530383033353162333436383734
          3636303162343435370a653538643133303331633234363831653132326531316263316535383436
          6236

# ====================
# SSH KEYS WITH VAULT STRINGS
# ====================

# SSH private key encrypted as vault string
