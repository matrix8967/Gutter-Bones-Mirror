ansible_connection=ssh
# ASUSWRT-Merlin uses standard SSH

[freshtomato_routers]
R7000 ansible_host=10.10.10.60 ansible_ssh_user=admin

[freshtomato_routers:vars]
ansible_port=8967
ansible_connection=ssh

[mikrotik_routers]
MikroTik ansible_host=10.10.10.75 ansible_ssh_user=admin

[mikrotik_routers:vars]
ansible_port=8967
ansible_connection=ssh

[unifi_devices]
UAP ansible_host=10.10.10.90 ansible_ssh_user=uap

[unifi_devices:vars]
ansible_port=22
ansible_connection=ssh

# ====================
# VM NETWORK (192.168.100.0/24)
# ====================

[vmnet]
# Ubuntu ansible_host=192.168.100.182 ansible_ssh_user=alex

[vmnet:vars]
ansible_port=22
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# REMOTE HOSTS VIA STYX JUMPHOST
# ====================

[styx_internal]
DeadSea ansible_host=DeadSea ansible_ssh_user=leviathan
# Luciferian_Towers ansible_host=LuciferianTowers
# DarkFort ansible_host=Dark-Fort
Behemoth ansible_host=Behemoth
Netwatch ansible_host=NetWatch
Thiccpad ansible_host=Thiccpad ansible_port=22

[styx_internal:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -q Styx"'
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# CLOUD PROVIDERS
# ====================

[vultr_hosts]
NewCastle ansible_host=NewCastle

[vultr_hosts:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -q Styx"'
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

[linode_hosts]
Styx ansible_host=Styx ansible_ssh_user=charon

[linode_hosts:vars]
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# LOGICAL GROUPINGS
# ====================

# Linux hosts only (excludes macOS)
[linux:children]
production_linux
vmnet
styx_internal
vultr_hosts
linode_hosts

# macOS hosts
[darwin:children]
apple

# All router firmware types (excludes unifi APs)
[routers:children]
ubiquiti_routers
asus_routers
freshtomato_routers
mikrotik_routers

# All network infrastructure (routers + APs)
[network_devices:children]
routers
unifi_devices

# Firmware-specific aliases for targeted playbook runs
[merlin:children]
asus_routers

[edgeos:children]
ubiquiti_routers

[freshtomato:children]
freshtomato_routers

[mikrotik:children]
mikrotik_routers

# Production environment (local subnet only)
[production:children]
production_linux
apple
network_devices

# Remote systems accessible via Styx jumphost
[remote:children]
styx_internal
vultr_hosts

# All systems in the local network
[darkfort:children]
production_linux

# ====================
# CTRLD TEST TARGETING
# ====================

# Linux hosts where ctrld runs as a systemd service
[ctrld_linux:children]
production_linux
styx_internal
vultr_hosts
linode_hosts

# macOS hosts where ctrld runs as a launchd daemon
[ctrld_darwin:children]
apple

# Routers where ctrld runs as an embedded binary
[ctrld_routers:children]
asus_routers
freshtomato_routers
ubiquiti_routers
mikrotik_routers

# All hosts capable of running ctrld test playbooks
[ctrld_targets:children]
ctrld_linux
ctrld_darwin
ctrld_routers

# ====================
# GLOBAL DEFAULTS
# ====================

[all:vars]
# Disable host key checking and X11 Forwarding for lab environment.
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ForwardX11=no'
# Use SSH key authentication
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Default timeout
ansible_ssh_timeout=30
