# ====================
# GUTTER BONEZ ANSIBLE INVENTORY
# ====================
# Organized by network location and device type
# All hosts use SSH key authentication

# ====================
# PRODUCTION SUBNET (10.10.10.0/24) - LINUX HOSTS
# ====================

[production_linux]
RPi5 ansible_host=10.10.10.5
Darlene ansible_host=10.10.10.10 ansible_ssh_user=pi
LittleHorn ansible_host=10.10.10.204
Netwatch ansible_host=10.10.10.119
Netwatch-Zero ansible_host=10.10.10.213
Mammon ansible_host=10.10.10.120
# RWB ansible_host=10.10.10.20
# Glitch ansible_host=10.10.10.100

[production_linux:vars]
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# PRODUCTION SUBNET - APPLE DEVICES
# ====================

[apple]
MacMini-Stepchild ansible_host=10.10.10.15
Macbook-Stepchild ansible_host=10.10.10.114

[apple:vars]
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# NETWORK DEVICES - ROUTERS/SWITCHES/APS
# ====================

[ubiquiti_routers]
Edgerouter ansible_host=10.10.10.1 ansible_ssh_user=Matrix
ERX ansible_host=10.10.10.55 ansible_ssh_user=Matrix
ERX-SFP ansible_host=10.10.10.50 ansible_ssh_user=Matrix

[ubiquiti_routers:vars]
ansible_port=8967
ansible_network_os=edgeos
ansible_connection=network_cli

[asus_routers]
AsusGTAX6000 ansible_host=10.50.50.1 ansible_ssh_user=azazel
AsusRTAX58U ansible_host=10.10.10.80 ansible_ssh_user=azazel

[asus_routers:vars]
