# ====================
# GUTTER BONEZ ANSIBLE INVENTORY
# ====================
# Organized by network location and device type
# All hosts use SSH key authentication

# ====================
# PRODUCTION SUBNET (10.10.10.0/24) - LINUX HOSTS
# ====================

[production_linux]
RPi5 ansible_host=10.10.10.5
Darlene ansible_host=10.10.10.10 ansible_ssh_user=pi
LittleHorn ansible_host=10.10.10.204
Netwatch ansible_host=10.10.10.119
Netwatch-Zero ansible_host=10.10.10.213
Mammon ansible_host=10.10.10.120
# RWB ansible_host=10.10.10.20
# Glitch ansible_host=10.10.10.100

[production_linux:vars]
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# PRODUCTION SUBNET - APPLE DEVICES
# ====================

[apple]
MacMini-Stepchild ansible_host=10.10.10.15
Macbook-Stepchild ansible_host=10.10.10.114

[apple:vars]
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# NETWORK DEVICES - ROUTERS/SWITCHES/APS
# ====================

[ubiquiti_routers]
Edgerouter ansible_host=10.10.10.1 ansible_ssh_user=Matrix
ERX ansible_host=10.10.10.55 ansible_ssh_user=Matrix
ERX-SFP ansible_host=10.10.10.50 ansible_ssh_user=Matrix

[ubiquiti_routers:vars]
ansible_port=8967
ansible_network_os=edgeos
ansible_connection=network_cli

[asus_routers]
AsusGTAX6000 ansible_host=10.10.10.85 ansible_ssh_user=azazel
AsusRTAX58U ansible_host=10.10.10.80 ansible_ssh_user=azazel

[asus_routers:vars]
ansible_port=8967
ansible_connection=ssh
# ASUSWRT-Merlin uses standard SSH

[other_routers]
R7000 ansible_host=10.10.10.60 ansible_ssh_user=admin
MikroTik ansible_host=10.10.10.75 ansible_ssh_user=admin

[other_routers:vars]
ansible_port=8967
ansible_connection=ssh

[unifi_devices]
UAP ansible_host=10.10.10.90 ansible_ssh_user=uap

[unifi_devices:vars]
ansible_port=8967
ansible_connection=ssh

# ====================
# VM NETWORK (192.168.100.0/24)
# ====================

[vmnet]
Ubuntu ansible_host=192.168.100.182 ansible_ssh_user=alex

[vmnet:vars]
ansible_port=22
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# REMOTE HOSTS VIA STYX JUMPHOST
# ====================

[styx_internal]
DeadSea ansible_host=DeadSea ansible_ssh_user=leviathan
Luciferian_Towers ansible_host=LuciferianTowers
DarkFort ansible_host=Dark-Fort
Behemoth ansible_host=Behemoth
Netwatch ansible_host=NetWatch
Thiccpad ansible_host=Thiccpad ansible_port=22

[styx_internal:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -q Styx"'
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# CLOUD PROVIDERS
# ====================

[vultr_hosts]
NewCastle ansible_host=NewCastle

[vultr_hosts:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -W %h:%p -q Styx"'
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

[linode_hosts]
Styx ansible_host=Styx ansible_ssh_user=charon

[linode_hosts:vars]
ansible_port=8967
ansible_ssh_user=azazel
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root

# ====================
# LOGICAL GROUPINGS
# ====================

# All Linux-based systems that can run standard playbooks
[linux:children]
production_linux
apple
vmnet
styx_internal
vultr_hosts
linode_hosts

# All network infrastructure devices
[network_devices:children]
ubiquiti_routers
asus_routers
other_routers
unifi_devices

# Production environment (local subnet)
[production:children]
production_linux
apple
network_devices

# Remote systems accessible via jumphost
[remote:children]
styx_internal
vultr_hosts

# All systems in the darkfort network
[darkfort:children]
production_linux

# ====================
# GLOBAL DEFAULTS
# ====================

[all:vars]
# Disable host key checking for lab environment
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
# Use SSH key authentication
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Default timeout
ansible_ssh_timeout=30
