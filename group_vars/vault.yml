---
# Ansible Vault File for Sensitive Variables
# This file contains encrypted sensitive information used across the infrastructure
# Encrypt this file with: ansible-vault encrypt group_vars/vault.yml

# ===========================
# AUTHENTICATION CREDENTIALS
# ===========================

# SSH Keys and Authentication
vault_ssh_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  # REPLACE WITH ACTUAL PRIVATE KEY CONTENT
  # This should be encrypted with ansible-vault
  -----END OPENSSH PRIVATE KEY-----

vault_ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAA... user@hostname"

# Service Account Credentials
vault_service_accounts:
  gitlab_runner:
    username: "gitlab-runner"
    ssh_key: "{{ vault_ssh_private_key }}"
  automation:
    username: "automation"
    ssh_key: "{{ vault_ssh_private_key }}"

# ===========================
# NETWORK INFRASTRUCTURE
# ===========================

# Router and Network Device Credentials
vault_network_credentials:
  edgerouter_admin:
    username: "admin_user"
    password: "secure_password_here"
  asuswrt_admin:
    username: "admin_user"
    password: "secure_password_here"
  mikrotik_admin:
    username: "admin_user"
    password: "secure_password_here"
  unifi_admin:
    username: "admin_user"
    password: "secure_password_here"

# Network Device SSH Keys
vault_network_ssh_keys:
  router_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    # REPLACE WITH ACTUAL ROUTER SSH KEY
    -----END OPENSSH PRIVATE KEY-----

# ===========================
# CONTROL D INTEGRATION
# ===========================

# Control D API and Service Credentials
vault_controld_credentials:
  api_key: "your_controld_api_key_here"
  device_id: "your_device_id_here"
  organization_id: "your_org_id_here"
  resolver_id: "your_resolver_id_here"

# Control D Service Configuration
vault_controld_config:
  upstream_resolvers:
    - name: "primary"
      endpoint: "https://freedns.controld.com/p1"
      bootstrap_ip: "76.76.19.19"
    - name: "secondary"
      endpoint: "https://freedns.controld.com/p2"
      bootstrap_ip: "76.76.2.22"

  listeners:
    - ip: "127.0.0.1"
      port: 53
      policy: "default"
    - ip: "0.0.0.0"
      port: 5353
      policy: "strict"

# ===========================
# MONITORING & OBSERVABILITY
# ===========================

# Monitoring Service Credentials
vault_monitoring_credentials:
  prometheus_admin:
    username: "admin"
    password: "secure_prometheus_password"
  grafana_admin:
    username: "admin"
    password: "secure_grafana_password"
    api_key: "grafana_api_key_here"

# External Monitoring Integrations
vault_external_monitoring:
  slack_webhook: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  pagerduty_key: "your_pagerduty_integration_key"
  email_smtp:
    server: "smtp.example.com"
    port: 587
    username: "alerts@example.com"
    password: "smtp_password_here"

# ===========================
# CLOUD PROVIDER CREDENTIALS
# ===========================

# AWS Credentials (if used)
vault_aws_credentials:
  access_key_id: "AKIAIOSFODNN7EXAMPLE"
  secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  region: "us-east-1"

# Azure Credentials (if used)
vault_azure_credentials:
  client_id: "your_azure_client_id"
  client_secret: "your_azure_client_secret"
  tenant_id: "your_azure_tenant_id"
  subscription_id: "your_azure_subscription_id"

# GCP Credentials (if used)
vault_gcp_credentials:
  service_account_key: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n",
      "client_email": "service-account@your-project.iam.gserviceaccount.com",
      "client_id": "client-id",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }

# ===========================
# DATABASE CREDENTIALS
# ===========================

# Database Connection Strings
vault_database_credentials:
  postgresql:
    host: "database.internal.local"
    port: 5432
    username: "app_user"
    password: "secure_db_password"
    database: "application_db"

  mysql:
    host: "mysql.internal.local"
    port: 3306
    username: "app_user"
    password: "secure_mysql_password"
    database: "application_db"

# ===========================
# APPLICATION SECRETS
# ===========================

# Application API Keys and Secrets
vault_application_secrets:
  jwt_secret: "your_jwt_signing_secret_here"
  encryption_key: "your_application_encryption_key"
  api_keys:
    external_service_1: "api_key_for_service_1"
    external_service_2: "api_key_for_service_2"

# Third-party Service Integration
vault_third_party_integrations:
  github:
    token: "ghp_your_github_personal_access_token"
    webhook_secret: "your_github_webhook_secret"

  gitlab:
    token: "glpat-your_gitlab_access_token"
    runner_token: "your_gitlab_runner_registration_token"

# ===========================
# CERTIFICATE AND TLS
# ===========================

# SSL/TLS Certificates and Keys
vault_ssl_certificates:
  internal_ca_key: |
    -----BEGIN PRIVATE KEY-----
    # REPLACE WITH ACTUAL CA PRIVATE KEY
    -----END PRIVATE KEY-----

  internal_ca_cert: |
    -----BEGIN CERTIFICATE-----
    # REPLACE WITH ACTUAL CA CERTIFICATE
    -----END CERTIFICATE-----

# ===========================
# BACKUP AND RECOVERY
# ===========================

# Backup Service Credentials
vault_backup_credentials:
  s3_backup:
    access_key: "backup_access_key_id"
    secret_key: "backup_secret_access_key"
    bucket: "infrastructure-backups"

  rsync_backup:
    username: "backup_user"
    ssh_key: "{{ vault_ssh_private_key }}"
    destination: "backup.internal.local"

# ===========================
# VAULT METADATA
# ===========================

# Vault Management Information
vault_metadata:
  created_date: "2025-01-05"
  last_updated: "2025-01-05"
  vault_version: "1.0"
  description: "Gutter Bonez Infrastructure Secrets"
  owner: "Infrastructure Team"

# Vault Access Control
vault_access_users:
  - username: "admin"
    role: "full_access"
  - username: "automation"
    role: "limited_access"
  - username: "readonly"
    role: "read_only"
# ===========================
# USAGE INSTRUCTIONS
# ===========================

# To use these variables in your playbooks:
# 1. Reference them as: "{{ vault_variable_name }}"
# 2. Ensure this file is encrypted: ansible-vault encrypt group_vars/vault.yml
# 3. Use the --ask-vault-pass flag when running playbooks
# 4. Or configure vault_password_file in ansible.cfg

# To encrypt this file:
# ansible-vault encrypt group_vars/vault.yml

# To edit this file:
# ansible-vault edit group_vars/vault.yml

# To view this file:
# ansible-vault view group_vars/vault.yml

# To decrypt this file (temporarily):
# ansible-vault decrypt group_vars/vault.yml

# Security best practices:
# - Regularly rotate all passwords and keys
# - Use strong, unique passwords for each service
# - Keep vault password secure and backed up
# - Regularly audit access to vault files
# - Use separate vault files for different environments
