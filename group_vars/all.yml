---
# Global Variables for Gutter Bonez Infrastructure Automation
# Azazel's Darkfort Network Environment
# Updated for production network topology

# ====================
# NETWORK TOPOLOGY
# ====================

# Domain Configuration
domain_name: darkfort
fqdn_suffix: .darkfort
search_domains:
  - darkfort
  - local

# Network Subnets
network_topology:
  primary:
    subnet: "10.10.10.0/24"
    gateway: "10.10.10.1"
    dns_primary: "10.10.10.53"
    description: "Production network"
    vlan_id: 10

  lab:
    subnet: "10.20.20.0/24"
    gateway: "10.20.20.1"
    description: "Isolated lab environment for testing"
    vlan_id: 20

  dmz:
    subnet: "10.30.30.0/24"
    gateway: "10.30.30.1"
    description: "DMZ and guest network"
    vlan_id: 30

# Primary Infrastructure
primary_gateway: 10.10.10.1
primary_dns: 10.10.10.1
primary_domain_controller: 10.10.10.1
monitoring_server: 10.10.10.10

# ====================
# CONTROL D CONFIGURATION
# ====================

# Service Configuration
ctrld_service_name: ctrld
ctrld_service_user: controld
ctrld_service_group: controld

# Path Configuration
ctrld_binary_path: /usr/local/bin/ctrld
ctrld_config_dir: /etc/ctrld
ctrld_config_file: /etc/ctrld/ctrld.toml
ctrld_log_dir: /var/log/ctrld
ctrld_log_file: /var/log/ctrld/ctrld.log
ctrld_pid_file: /var/run/ctrld.pid

# Default Listeners
ctrld_listeners:
  - ip: "0.0.0.0"
    port: 53
    policy_name: "default_policy"
    rules:
      - domains: ["*.darkfort"]
        upstream: "local_dns"
      - domains: ["*.local"]
        upstream: "local_dns"

# Default Upstreams
ctrld_upstreams:
  - name: "controld_primary"
    type: "doh"
    endpoint: "https://freedns.controld.com/p0"
    bootstrap_ip: "76.76.2.0"
    timeout: 3000
  - name: "controld_secondary"
    type: "doh"
    endpoint: "https://freedns.controld.com/p1"
    bootstrap_ip: "76.76.10.0"
    timeout: 3000
  - name: "local_dns"
    type: "legacy"
    endpoint: "{{ primary_dns }}:53"
    timeout: 1000

# Default Policies
ctrld_policies:
  - name: "default_policy"
    description: "Default policy for darkfort network"
    upstreams: ["controld_primary", "controld_secondary"]
    rules:
      - action: "allow"
        domains: ["*.darkfort", "*.local"]
      - action: "block"
        categories: ["malware", "phishing"]

# Service Configuration
ctrld_defaults:
  create_user: true
  enable_service: true
  start_service: true
  validate_config: true
  backup_config: true
  force_install: false
  log_level: "info"
  log_rotation: true

# ====================
# TESTING CONFIGURATION
# ====================

# Test Environment Settings
test_environment: production
test_environments:
  production:
    chaos_enabled: false
    performance_tests: true
    test_duration_multiplier: 1.0
    fail_on_test_failure: true

  staging:
    chaos_enabled: true
    performance_tests: true
    test_duration_multiplier: 1.5
    fail_on_test_failure: false

  development:
    chaos_enabled: true
    performance_tests: false
    test_duration_multiplier: 0.5
    fail_on_test_failure: false

# Test Directory Configuration
test_results_dir: /tmp/gutter_bonez_tests
discovery_results_dir: /tmp/gutter_bonez_discovery
chaos_results_dir: /tmp/gutter_bonez_chaos

# Chaos Engineering Configuration
chaos_config:
  latency_ms: 50
  jitter_ms: 10
  disruption_duration: 30
  packet_loss_percent: 3
  memory_pressure_mb: 100
  stress_duration: 20

# Test Matrix Configuration
test_matrix:
  dns_test_domains:
    - "google.com"
    - "verify.controld.com"
    - "cloudflare.com"
    - "github.com"
    - "{{ inventory_hostname }}.{{ domain_name }}"

  blocked_test_domains:
    - "malware.testcategory.com"
    - "ads.testcategory.com"
    - "phishing.testcategory.com"

  performance_test_queries: 100
  concurrent_test_connections: 50

# ====================
# ROUTER CONFIGURATIONS
# ====================

# Router Path Mappings
router_paths:
  edgeos:
    binary_path: /usr/local/bin/ctrld
    config_dir: /config/ctrld
    config_file: /config/ctrld/ctrld.toml
    service_path: /etc/init.d/ctrld

  asuswrt_merlin:
    binary_path: /jffs/controld/ctrld
    config_dir: /jffs/controld
    config_file: /jffs/controld/ctrld.toml
    service_path: /jffs/scripts/services-start

  freshtomato:
    binary_path: /jffs/controld/ctrld
    config_dir: /jffs/controld
    config_file: /jffs/controld/ctrld.toml
    service_path: /jffs/scripts/init

# Router Credentials (using SSH keys)
router_ssh_config:
  edgeos:
    ansible_user: azazel
    ansible_port: 8967

  asuswrt_merlin:
    ansible_user: azazel
    ansible_port: 8967

  freshtomato:
    ansible_user: root
    ansible_port: 22

# ====================
# SYSTEM CONFIGURATION
# ====================

# SSH Configuration
ssh_config:
  port: 8967
  #  key_type: ed25519
  disable_root_login: true
  disable_password_auth: true
  allow_users: ["azazel", "{{ ansible_user }}"]

# Firewall Configuration
firewall_config:
  enable_ufw: true
  default_policy: deny
  allowed_ports:
    - 22/tcp # SSH
    - 53/tcp # DNS
    - 53/udp # DNS
    - 80/tcp # HTTP
    - 443/tcp # HTTPS
    - 8080/tcp # UniFi controller
    - 8967/tcp # SSH

# Package Management
base_packages:
  debian:
    - curl
    - wget
    - git
    - vim
    - htop
    - net-tools
    - dnsutils
    - tcpdump
    - nmap
    - fail2ban

  rhel:
    - curl
    - wget
    - git
    - vim
    - htop
    - net-tools
    - bind-utils
    - tcpdump
    - nmap
    - fail2ban

# ====================
# MONITORING & LOGGING
# ====================

# Log Configuration
log_config:
  retention_days: 30
  rotation_size: 100M
  compression: true

  syslog_server: "{{ monitoring_server }}"

  log_levels:
    production: info
    staging: debug
    development: debug

# Monitoring Configuration
monitoring_config:
  enable_prometheus: true
  enable_grafana: true
  prometheus_port: 9090
  grafana_port: 3000

  check_intervals:
    dns_health: 30s
    service_health: 60s
    network_connectivity: 300s

# ====================
# BACKUP CONFIGURATION
# ====================

backup_config:
  enable_backups: true
  backup_retention_days: 90
  backup_schedule: "0 2 * * *" # Daily at 2 AM

  backup_targets:
    - /etc/ctrld/
    - /var/log/ctrld/
    - ~/.ssh/
    - /etc/ansible/

  backup_destination: "/backup/{{ inventory_hostname }}"
  remote_backup_server: "{{ monitoring_server }}"

# ====================
# SECURITY CONFIGURATION
# ====================

security_config:
  enable_fail2ban: true
  enable_auto_updates: true

  fail2ban_config:
    bantime: 3600
    findtime: 600
    maxretry: 3

  allowed_networks:
    - "10.10.10.0/24"
    - "10.20.20.0/24"
    - "127.0.0.1/8"

  blocked_networks:
    - "192.168.0.0/16" # Generic RFC1918 - not used in darkfort
    - "172.16.0.0/12" # Generic RFC1918 - not used in darkfort

# ====================
# ANSIBLE CONFIGURATION
# ====================

# Ansible Execution Settings
ansible_config:
  host_key_checking: false
  timeout: 300
  forks: 10
  retry_files_enabled: false
  stdout_callback: yaml
  gather_timeout: 30

# Vault Configuration
vault_config:
  vault_password_file: .Vault_Pass.txt
  vault_encrypt_identity: "{{ ansible_user }}"

# ====================
# ENVIRONMENT METADATA
# ====================

# Infrastructure Metadata
infrastructure_metadata:
  environment: "{{ test_environment | default('production') }}"
  domain: "{{ domain_name }}"
  primary_gateway_model: "EdgeRouter 8 Pro"
  primary_switch_model: "EdgeSwitch 10X"
  wireless_controller: "UniFi UAP-SHD"

  network_design:
    topology: "segmented_vlans"
    isolation_model: "subnet_based"
    routing_protocol: "static"
    dns_architecture: "hierarchical"

  security_model:
    authentication: "ssh_key"
    authorization: "sudo_group"
    network_access: "vlan_based"
    monitoring: "centralized"

# Version Information
gutter_bonez_version: "2.0.0"
last_updated: "{{ ansible_date_time.iso8601 }}"
managed_by: "gutter_bonez infrastructure automation"
